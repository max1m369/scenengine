<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D-прогулка: Выставочный стенд Росатом</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    if (window.location.pathname === '/scenengine') {
      window.location.replace('/scenengine/');
    }
  </script>
  <script type="module" crossorigin src="./assets/index-Cf1U4dys.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DAFNk5r5.css">
</head>
<body>
  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Reticle -->
  <div id="reticle">
    <div class="reticle-dot"></div>
  </div>

  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-overlay">
    <div class="loading-content">
      <div class="logo-badge">
        <span class="logo-icon">⚡</span>
        <span class="logo-title">РОСАТОМ • ЭЛЕКТРОДВИЖЕНИЕ</span>
      </div>
      <h1 class="loading-heading">3D Выставочный стенд</h1>
      <p class="loading-subheading">Интерактивная прогулка от первого лица</p>
      
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="progress-info">
        <span id="loading-status">Загрузка стенда...</span>
        <span id="loading-percent">0%</span>
      </div>
    </div>
  </div>

  <!-- Minimal Clean HUD Layer -->
  <div class="hud-layer">
    <!-- Top Header -->
    <header class="top-nav">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <div class="brand-info">
          <span class="brand-name">РОСАТОМ</span>
          <span class="brand-project">Стенд «От Атома к Движению»</span>
        </div>
      </div>

      <div class="top-actions">
        <button id="reset-cam-btn" class="action-btn" title="Вернуться к исходной точке">
          <span>🔄 Исходный вид</span>
        </button>
        <button id="fullscreen-btn" class="action-btn" title="Полноэкранный режим">
          <span>⛶</span>
        </button>
      </div>
    </header>

    <!-- Bottom Controls Hint -->
    <footer class="bottom-bar">
      <div class="controls-pill">
        <span class="ctrl-group"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>Стрелки</kbd> Перемещение</span>
        <span class="ctrl-sep">•</span>
        <span class="ctrl-group">🖱️ Зажать мышь — Обзор</span>
        <span class="ctrl-sep">•</span>
        <span class="ctrl-group"><kbd>Shift</kbd> Бег</span>
        <span class="ctrl-sep">•</span>
        <span class="ctrl-group"><kbd>Пробел</kbd> Прыжок</span>
      </div>
      
      <div class="fps-pill" id="fps-counter">60 FPS</div>
    </footer>
  </div>

</body>
</html>
